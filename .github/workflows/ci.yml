name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS 実装と実装間の検証
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: conformance

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0"

      # 版は rust-toolchain.toml に従う。stable が動くたびにキャッシュを捨てないため。
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      # MuPDF を C のソースからビルドするため、キャッシュが無いと数分かかる。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri
          shared-key: tauri-core
          cache-on-failure: true

      - name: 検証ツール自身のテスト
        working-directory: conformance
        run: bundle exec ruby test/runner_test.rb

      - name: 合成フィクスチャを作る
        working-directory: conformance
        run: |
          bundle exec ./choroconf generate

      - name: Swift のビルドとテスト
        working-directory: macos
        # 実書籍を使うテストは local-books.json が無ければスキップされる
        run: |
          swift build
          swift test

      - name: アプリを組み立てる
        working-directory: macos
        run: ./make-app.sh

      # 突き合わせに要るのは probe だけ。画面まで組み立てると webkit 一式が付いてくる。
      # 画面は cargo check で通ることだけ見る。Windows 側では毎回まるごと組み立てている。
      # **すべて --release で揃える。** cargo check だけ dev プロファイルにすると、
      # ビルドスクリプトがもう一度走り、MuPDF を C から 2 度組むことになる
      # （実測：release ビルドの後の dev の check に 1 分 3 秒、CPU 時間 3 分 9 秒）。
      # 成果物も二重に残り、キャッシュが上限を圧迫する（dev 側だけで 878 MB）。
      # 出荷するのは release の形なので、見るならそちらでよい
      # （両者で違うのは main.rs の windows_subsystem 属性だけである）。
      - name: Rust のビルドとテスト
        working-directory: tauri
        run: |
          cargo build --release -p choroprobe
          cargo test --release -p chororeader-core
          cargo check --release -p chororeader

      # Core と Probe は net10.0 のままにしてあるので、Windows マシン無しで組める。
      - name: C# のビルドとテスト
        working-directory: windows
        run: |
          dotnet build ChoroReader.Probe/ChoroReader.Probe.csproj
          dotnet test ChoroReader.Tests/ChoroReader.Tests.csproj

      # .NET も Rust も macOS で動くため、3 実装の突き合わせはこのジョブ 1 つで完結する。
      - name: 期待値との照合と、実装間の突き合わせ
        working-directory: conformance
        run: |
          cat > probes.json <<'JSON'
          {
            "swift": ["macos/build/ChoroReader.app/Contents/MacOS/ChoroReader"],
            "rust": ["tauri/target/release/choroprobe"],
            "csharp": ["dotnet", "windows/ChoroReader.Probe/bin/Debug/net10.0/choroprobe.dll"]
          }
          JSON
          bundle exec ./choroconf check swift
          bundle exec ./choroconf check rust
          bundle exec ./choroconf check csharp
          bundle exec ./choroconf diff swift rust
          bundle exec ./choroconf diff swift csharp

  csharp-build:
    name: C# 実装のビルドとテスト（Windows）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # 索引の検査は合成フィクスチャを使う。生成物なので追跡しておらず、ここで作る。
      # Ruby が要るのはそのためだけで、Windows で conformance を回すわけではない。
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: conformance

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0"

      - name: 合成フィクスチャを作る
        working-directory: conformance
        # Windows では shebang が効かないので、ruby から起動する。
        run: bundle exec ruby choroconf generate

      - working-directory: windows
        run: |
          dotnet build ChoroReader.Core/ChoroReader.Core.csproj
          dotnet build ChoroReader.Probe/ChoroReader.Probe.csproj
          dotnet test ChoroReader.Tests/ChoroReader.Tests.csproj

      # 窓の中は目で見られないので、判定をアプリに持たせてある。
      # 窓の数だけを見ていては、枠だけ出来て中身が空の状態を捕まえられない。
      - name: 読書の窓の動作確認
        working-directory: windows
        timeout-minutes: 5
        run: dotnet run --project ChoroReader.App/ChoroReader.App.csproj -- ../conformance/fixtures/epub3-basic.epub --selftest

      # 紙面は名乗る相手がいないので、出ている絵そのものを見る。
      - name: 紙面の窓の動作確認
        working-directory: windows
        timeout-minutes: 5
        run: dotnet run --project ChoroReader.App/ChoroReader.App.csproj -- ../samples/sample.pdf --selftest

      # 横断検索そのものは ChoroReader.Tests が押さえている。ここは画面までつながっているかを見る。
      - name: 書棚の窓の動作確認
        working-directory: windows
        timeout-minutes: 5
        run: >
          dotnet run --project ChoroReader.App/ChoroReader.App.csproj --
          --shelf --selftest
          ../conformance/fixtures/epub3-basic.epub
          ../conformance/fixtures/footnotes.epub
          ../samples/sample.pdf

  webview2-spike:
    name: WebView2 の前提を確かめる
    runs-on: windows-latest
    # 判定が終わらないまま占有しないよう上限を置く。プログラム側にも 120 秒の見張りがある。
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0"

      # 書籍側の JavaScript を止めたまま、アプリの注入スクリプトとメッセージが動くかを見る。
      # C# の UI を作るなら、ここが崩れると EPUB ナビゲータの作りを見直す必要がある。
      - name: スパイクを実行する
        working-directory: windows
        run: dotnet run --project ChoroReader.WebViewSpike/ChoroReader.WebViewSpike.csproj


