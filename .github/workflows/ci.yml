name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS 実装と実装間の検証
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: conformance

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0"

      - name: 検証ツール自身のテスト
        working-directory: conformance
        run: bundle exec ruby test/runner_test.rb

      - name: 合成フィクスチャを作る
        working-directory: conformance
        run: |
          bundle exec ./tzconf generate

      - name: Swift のビルドとテスト
        working-directory: macos
        # 実書籍を使うテストは local-books.json が無ければスキップされる
        run: |
          swift build
          swift test

      - name: アプリを組み立てる
        working-directory: macos
        run: ./make-app.sh

      - name: C# のビルド
        working-directory: windows
        run: dotnet build TZReader.Probe/TZReader.Probe.csproj

      # .NET は macOS でも動くため、2 実装の突き合わせはこのジョブ 1 つで完結する。
      - name: 期待値との照合と、実装間の突き合わせ
        working-directory: conformance
        run: |
          cat > probes.json <<'JSON'
          {
            "swift": ["macos/build/TZReader.app/Contents/MacOS/TZReader"],
            "csharp": ["dotnet", "windows/TZReader.Probe/bin/Debug/net10.0/tzprobe.dll"]
          }
          JSON
          bundle exec ./tzconf check swift
          bundle exec ./tzconf check csharp
          bundle exec ./tzconf diff swift csharp

  webview2-spike:
    name: WebView2 の前提を確かめる
    runs-on: windows-latest
    # 判定が終わらないまま占有しないよう上限を置く。プログラム側にも 120 秒の見張りがある。
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0"

      # 書籍側の JavaScript を止めたまま、アプリの注入スクリプトとメッセージが動くかを見る。
      # macOS では成り立つことを確認済み（spikes/findings.md のスパイク 4）。
      # ここが崩れると EPUB ナビゲータの作りを見直す必要がある。
      - name: スパイクを実行する
        working-directory: windows
        run: dotnet run --project TZReader.WebViewSpike/TZReader.WebViewSpike.csproj

  tauri-spike-windows:
    name: Tauri の前提を Windows で確かめる
    runs-on: windows-latest
    # MuPDF を C のソースからビルドするため、初回は長い。
    # プログラム側にも 120 秒の見張りがある。
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/tauri-spike/src-tauri

      # macOS では成り立つことを確認済み（spikes/findings-tauri.md のスパイク 6）。
      # WebView2 は Chromium であり、iframe の sandbox の扱いも生成元の扱いも同じとは限らない。
      # 書籍は置かないため、判定するのは「書籍の JS を止められるか」と「生成元が揃うか」の 2 点。
      - name: スパイクを実行する
        working-directory: spikes/tauri-spike/src-tauri
        run: cargo run --release

  windows-build:
    name: Windows 実装のビルド
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0"
      - working-directory: windows
        run: |
          dotnet build TZReader.Core/TZReader.Core.csproj
          dotnet build TZReader.Probe/TZReader.Probe.csproj
