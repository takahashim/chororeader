name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS 実装と実装間の検証
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: conformance

      - uses: dtolnay/rust-toolchain@stable

      # MuPDF を C のソースからビルドするため、キャッシュが無いと数分かかる。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri
          shared-key: tauri-core
          cache-on-failure: true

      - name: 検証ツール自身のテスト
        working-directory: conformance
        run: bundle exec ruby test/runner_test.rb

      - name: 合成フィクスチャを作る
        working-directory: conformance
        run: |
          bundle exec ./tzconf generate

      - name: Swift のビルドとテスト
        working-directory: macos
        # 実書籍を使うテストは local-books.json が無ければスキップされる
        run: |
          swift build
          swift test

      - name: アプリを組み立てる
        working-directory: macos
        run: ./make-app.sh

      - name: Rust のビルドとテスト
        working-directory: tauri
        run: |
          cargo build --release
          cargo test --release

      # Rust は macOS でも動くため、2 実装の突き合わせはこのジョブ 1 つで完結する。
      - name: 期待値との照合と、実装間の突き合わせ
        working-directory: conformance
        run: |
          cat > probes.json <<'JSON'
          {
            "swift": ["macos/build/TZReader.app/Contents/MacOS/TZReader"],
            "rust": ["tauri/target/release/tzprobe"]
          }
          JSON
          bundle exec ./tzconf check swift
          bundle exec ./tzconf check rust
          bundle exec ./tzconf diff swift rust


