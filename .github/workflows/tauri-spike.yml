name: Windows での確認

# 本体の CI から切り離してある。
# MuPDF を C のソースからビルドするため、キャッシュが冷えていると十数分かかる。
# 他のジョブが 1〜2 分で終わるのに毎回それを払うのは割に合わない。
# Rust 側を触ったときと、手で起動したときだけ走らせる。
on:
  push:
    paths:
      - "spikes/tauri-spike/**"
      - "spikes/rust-mupdf/**"
      - "tauri/**"
      - ".github/workflows/tauri-spike.yml"
  workflow_dispatch:

env:
  # CI では毎回まっさらから作るので増分コンパイルは効かない。
  # 生成物が増えてキャッシュの出し入れが重くなるだけになる。
  CARGO_INCREMENTAL: 0

jobs:
  windows:
    name: Tauri の前提を Windows で確かめる
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/tauri-spike/src-tauri
          # 既定のキャッシュキーはジョブ名から作られるため、ジョブを移したり
          # 名前を変えたりするだけで取り違える。固定の名前を与えて動かないようにする。
          shared-key: tauri-spike
          # 既定では失敗した実行のキャッシュを残さない。
          # ビルドが通るまで直しを繰り返す間、毎回まっさらから作り直すことになる。
          cache-on-failure: true

      # macOS では成り立つことを確認済み（spikes/findings-tauri.md のスパイク 6）。
      # WebView2 は Chromium であり、iframe の sandbox の扱いも生成元の扱いも同じとは限らない。
      # 書籍は置かないため、判定するのは「書籍の JS を止められるか」と「生成元が揃うか」の 2 点。
      - name: スパイクを実行する
        working-directory: spikes/tauri-spike/src-tauri
        run: cargo run --release

  # 本体の動作確認。Windows の実機に触れないまま作っている部分を機械的に潰す。
  # 人の操作が要る分（右クリック、修飾キー、落とし込み）はここでは飛ばす。
  # それらはアプリのヘルプ献立から「動作確認…」を選べば、手元で順に確かめられる。
  selftest-windows:
    name: Tauri 版の動作確認を Windows で回す
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri
          shared-key: tauri-app-windows
          cache-on-failure: true

      # 同梱のサンプルで確かめる。実書籍を置けないマシンでも、これだけで足りる。
      - name: 動作確認を走らせる
        working-directory: tauri
        env:
          TZR_SELFTEST: "1"
        run: cargo run --release -p tzreader -- ../samples/sample-reflowable.epub
