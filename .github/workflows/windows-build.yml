name: Windows 版

# 手元に Windows が無いので、ここが唯一の確かめ場所であり、配布物を作る唯一の出口でもある。
#
# 普段の push では組み立てと動作確認だけを行う。
# インストーラを作るのは手で起こしたときと公開したときに限る。
# WiX と NSIS の取得と包装で数分かかり、毎回払う理由が無いためである。
on:
  push:
    paths:
      - "tauri/**"
      - "samples/**"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:
  release:
    types: [published]

env:
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: 組み立てて動作を確かめる
    runs-on: windows-latest
    # MuPDF を C のソースからビルドするため、キャッシュが冷えていると長い。
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # 版は rust-toolchain.toml に従う。stable が動くたびにキャッシュを捨てないため。
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri
          shared-key: tauri-app-windows
          cache-on-failure: true

      # OCR は使わないのに、Windows では毎回コンパイルされる。
      # mupdf-sys の機能指定は MSBuild では効かないので、参照そのものを削る。
      # 当てる先が見つからなければ失敗する。版が上がって形が変われば気付けるようにするため。
      - name: MuPDF から OCR を削る
        working-directory: tauri
        run: |
          cargo fetch
          ruby trim-mupdf.rb

      - name: 組み立てる
        working-directory: tauri
        run: cargo build --release -p tzreader

      # 書籍を開いた窓。本文、目次、章送り、履歴、検索がつながっているかを見る。
      #
      # 結果はファイルへ書かせて読み上げる。
      # Windows の release は端末を持たないので、標準出力はどこにも届かない。
      # 終了コードだけでは、どの検査で落ちたのかが分からない。
      - name: 動作確認（書籍を開いた窓）
        working-directory: tauri
        shell: pwsh
        env:
          TZR_SELFTEST: "1"
          TZR_SELFTEST_OUT: selftest-book.json
        run: |
          ./target/release/tzreader.exe ../samples/sample-reflowable.epub
          $code = $LASTEXITCODE
          if (Test-Path selftest-book.json) { Get-Content selftest-book.json }
          else { "結果が書かれなかった" }
          exit $code

      # 引数なしの窓。書籍を 1 冊も持たないマシンでは、まずこれが開く。
      # ここが黙って死ぬと「窓は出るが何も操作できない」という形になる。
      - name: 動作確認（書棚の窓）
        working-directory: tauri
        shell: pwsh
        env:
          TZR_SELFTEST: "1"
          TZR_SELFTEST_OUT: selftest-shelf.json
        run: |
          ./target/release/tzreader.exe
          $code = $LASTEXITCODE
          if (Test-Path selftest-shelf.json) { Get-Content selftest-shelf.json }
          else { "結果が書かれなかった" }
          exit $code

      # ここから下は配布物を作るとき（手で起こす、または公開）だけ。
      - name: Tauri の道具を入れる
        if: github.event_name != 'push'
        run: npm install -g @tauri-apps/cli@^2

      - name: 入れ物を作る
        if: github.event_name != 'push'
        working-directory: tauri/app
        run: tauri build

      # 空の成果物が黙って上がるのを防ぐ。
      - name: 出来たものを確かめる
        if: github.event_name != 'push'
        shell: pwsh
        working-directory: tauri/target/release
        run: |
          $found = Get-ChildItem -Recurse -Path bundle -Include *.msi, *.exe |
            Where-Object { $_.Length -gt 0 }
          if (-not $found) { throw "配布物が 1 つも出来ていない" }
          $found | ForEach-Object { "{0,12:N0} バイト  {1}" -f $_.Length, $_.Name }

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'push'
        with:
          name: tzreader-windows
          if-no-files-found: error
          retention-days: 30
          path: |
            tauri/target/release/bundle/msi/*.msi
            tauri/target/release/bundle/nsis/*.exe
            tauri/target/release/tzreader.exe
