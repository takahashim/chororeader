name: Windows 版

# 手元に Windows が無いので、ここが配布物を作る唯一の出口になる。
# 組み立てたその場で動作確認も走らせる。
# 別のジョブに分けると MuPDF を 2 度ビルドすることになり、その時間が惜しい。
on:
  push:
    paths:
      - "tauri/**"
      - "samples/**"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:
  release:
    types: [published]

env:
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: 組み立てて動作を確かめる
    runs-on: windows-latest
    # MuPDF を C のソースからビルドするため、キャッシュが冷えていると長い。
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri
          shared-key: tauri-app-windows
          cache-on-failure: true

      # 素のバイナリを取ってくるだけなので、cargo install より桁違いに速い。
      - name: Tauri の道具を入れる
        run: npm install -g @tauri-apps/cli@^2

      # WiX と NSIS は Tauri が要るときに取りに行く。ここでは何も置かない。
      - name: 組み立てる
        working-directory: tauri/app
        run: tauri build

      # 空の成果物が黙って上がるのを防ぐ。
      - name: 出来たものを確かめる
        shell: pwsh
        working-directory: tauri/target/release
        run: |
          $found = @()
          if (Test-Path bundle) {
            $found += Get-ChildItem -Recurse -Path bundle -Include *.msi, *.exe |
              Where-Object { $_.Length -gt 0 }
          }
          if (Test-Path tzreader.exe) { $found += Get-Item tzreader.exe }
          if (-not $found) { throw "配布物が 1 つも出来ていない" }
          $found | ForEach-Object { "{0,12:N0} バイト  {1}" -f $_.Length, $_.Name }

      # 同梱のサンプルで、画面まで含めた振る舞いを確かめる。
      # 人の操作が要る分（右クリック、修飾キー、落とし込み）はここでは飛ばす。
      # それらはアプリのヘルプ献立から「動作確認…」を選べば手元で順に確かめられる。
      - name: 動作確認を走らせる
        working-directory: tauri
        env:
          TZR_SELFTEST: "1"
        run: ./target/release/tzreader.exe ../samples/sample-reflowable.epub

      - uses: actions/upload-artifact@v4
        with:
          name: tzreader-windows
          if-no-files-found: error
          retention-days: 30
          path: |
            tauri/target/release/bundle/msi/*.msi
            tauri/target/release/bundle/nsis/*.exe
            tauri/target/release/tzreader.exe
