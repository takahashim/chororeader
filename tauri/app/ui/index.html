<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>tzreader</title>
<link rel="stylesheet" href="/app/app.css">
</head>
<body>

<header id="bar">
  <button id="toggle-sidebar" title="目次（⌘\）">☰</button>
  <span id="history">
    <button id="go-back" title="戻る（⌘[）" disabled>‹</button>
    <button id="go-forward" title="進む（⌘]）" disabled>›</button>
  </span>
  <span id="book-title">tzreader</span>
  <span class="spacer"></span>
  <span id="zoom">
    <button id="zoom-out" title="縮小（⌘−）">−</button>
    <span id="zoom-level">100%</span>
    <button id="zoom-in" title="拡大（⌘+）">＋</button>
  </span>
  <select id="layout" title="並べ方" hidden>
    <option value="continuousScroll">連続スクロール</option>
    <option value="singlePage">単ページ</option>
    <option value="spread">見開き</option>
  </select>
  <select id="fit" title="合わせ方" hidden>
    <option value="width">横幅に合わせる</option>
    <option value="page">ページ全体</option>
    <option value="actual">原寸</option>
    <option value="custom">倍率を保つ</option>
  </select>
  <input id="search-input" type="search" placeholder="この書籍を検索" spellcheck="false">
  <button id="bookmark" title="しおり（⌘D）">☆</button>
  <button id="settings-button" title="表示設定">Aa</button>
  <button id="new-window" title="この場所を新しいウィンドウで開く（⌘N）">⧉</button>
  <button id="shelf-button" title="書棚（⌘L）">書棚</button>
  <button id="open-button" title="書籍を開く（⌘O）">開く</button>
</header>

<div id="layout">
  <nav id="sidebar">
    <div id="sidebar-tabs">
      <button data-pane="toc" class="on">目次</button>
      <button data-pane="results">検索</button>
      <button data-pane="bookmarks">しおり</button>
    </div>
    <div id="toc" class="pane"></div>
    <div id="results" class="pane" hidden></div>
    <div id="bookmarks" class="pane" hidden></div>
  </nav>

  <main id="stage" tabindex="-1">
    <!-- 本文。allow-scripts を与えないので書籍の script は動かない。
         allow-same-origin だけ与えて、親からこの中の DOM を触れるようにする。 -->
    <iframe id="page" sandbox="allow-same-origin" title="本文"></iframe>
    <div id="pdf" tabindex="-1" hidden></div>
</main>
</div>

<div id="shelf">
  <div id="shelf-bar">
    <h1>書棚</h1>
    <span class="spacer"></span>
    <span id="shelf-modes">
      <button data-mode="cover" title="表紙で並べる">表紙</button>
      <button data-mode="table" title="表で並べる">一覧</button>
    </span>
    <button id="shelf-open">書籍を開く…</button>
  </div>
  <div id="shelf-grid"></div>
  <table id="shelf-table" hidden>
    <thead><tr><th></th><th>題名</th><th>著者</th><th>形式</th><th>読み進み</th></tr></thead>
    <tbody></tbody>
  </table>
  <p id="shelf-empty" hidden>まだ開いた書籍がありません。EPUB か PDF を開いてください。</p>
</div>

<div id="settings" hidden>
  <label>文字サイズ <input type="range" id="fontSizePercent" min="70" max="200" step="5"><span></span></label>
  <label>行間 <input type="range" id="lineHeight" min="1.2" max="2.6" step="0.1"><span></span></label>
  <label>本文幅 <input type="range" id="maxWidthEm" min="0" max="80" step="2"><span></span></label>
  <label>テーマ
    <select id="theme">
      <option value="light">明るい</option>
      <option value="sepia">セピア</option>
      <option value="dark">暗い</option>
    </select>
  </label>
  <label><input type="checkbox" id="codeWrap"> コードを折り返す</label>
  <label><input type="checkbox" id="publisherStyle"> 出版社のスタイルを優先</label>
</div>

<!-- 目次や検索結果で右クリックしたときに出す。WebView 既定の献立は出さない。 -->
<div id="menu" hidden></div>

<div id="popover" hidden><div id="popover-body"></div></div>
<div id="toast" hidden></div>

<script src="/app/app.js"></script>
</body>
</html>
